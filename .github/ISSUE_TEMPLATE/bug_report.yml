name: Bug report
description: 버그를 제보해 주세요. / Report a bug.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        어떤 동작이 잘못됐는지 설명해 주세요.
        Describe the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        재현 방법을 적어 주세요. 사용한 데모 사용자(A~D), 업로드한 파일의 형식·크기, 화면 경로를 구체적으로 적어 주시면 좋습니다.
        Describe how to reproduce it. Include the demo user (A-D), the type and size of the uploaded file, and the screen you were on.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: |
        원래 어떻게 동작해야 하는지 적어 주세요.
        Describe what you expected to happen.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: |
        브라우저 이름과 버전을 적어 주세요. (예: Chrome 130)
        Browser name and version. (e.g. Chrome 130)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: |
        어느 환경에서 겪었는지 골라 주세요.
        Where did you run into it?
      options:
        - local (npm run dev)
        - local (npm run preview)
        - deployed
        - other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: |
        실행한 커밋 해시를 적어 주세요. (`git rev-parse --short HEAD`)
        The commit you were running. (`git rev-parse --short HEAD`)

  - type: textarea
    id: logs
    attributes:
      label: Console / Network logs
      description: |
        브라우저 콘솔 오류나 실패한 API 응답을 붙여 주세요. 키·토큰은 지워 주세요.
        Paste browser console errors or failed API responses. Remove any keys or tokens.
      render: shell

  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: 이 문제를 고치는 PR을 올릴 수 있습니다. / I am willing to submit a PR.
